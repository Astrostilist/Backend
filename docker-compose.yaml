# docker-compose.yaml — продакшн/серверный стек.
# Все сервисы в одной compose-сети, наружу выставлен только Caddy (80/443).
# Приложение поднимается через образ ${APP_IMAGE}.
#
# Запуск: docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: ["-js", "-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats-data:/data
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8222/healthz?js-enabled-only=true >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  memcached:
    image: memcached:1.6.39-alpine
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=2
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc -q 1 127.0.0.1 11211 | grep -q 'STAT pid'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/astrostilist/backend:main}
    env_file:
      - .env
    environment:
      - CORS_ALLOWED_ORIGINS
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      memcached:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0
    environment:
      - CADDY_DOMAIN_NAME
      - CADDY_LETSENCRYPT_EMAIL
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
      - ~/frontend/dist:/var/www/frontend
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"


volumes:
  pgdata:
  nats-data:
  caddy-config:
  caddy-data:
  prometheus_data:
