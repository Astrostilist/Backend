jetstream: enable

# Logging
# NATS 2.10+ использует другой формат логирования
debug: false
trace: false
logtime: true

# JetStream configuration
jetstream {
    max_mem: 1G
    max_file: 10G
}

# Authorization (optional - uncomment if you want to enable auth)
# authorization {
#     users = [
#         {user: "user", password: "password"}
#     ]
# }

# Monitoring
http_port = 8222