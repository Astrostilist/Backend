openapi: 3.0.3
info:
  title: Astro Backend API
  version: 0.1.0
paths:
  /api/v1/:
    get:
      summary: Service health endpoint
      responses:
        "200":
          description: API and database status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/v1/admin/rules:
    get:
      summary: List astro rules
      security:
        - bearerAuth: []
      parameters:
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated astro rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRulesListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an astro rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRulePayload"
      responses:
        "201":
          description: Astro rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRuleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/admin/rules/{id}:
    put:
      summary: Update an astro rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRulePayload"
      responses:
        "200":
          description: Astro rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRuleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Soft delete an astro rule by deactivating it
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Astro rule deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRuleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/user/{user_id}:
    delete:
      summary: Delete user
      description: | 
       Удаление данных пользователя.
       Операция удаляет:
       - users — основная запись;
       - user_consents — история согласий;
       - generation_results — результаты генерации для пользователя;
       - feedback — обратная связь от пользователя.
      tags: [Client API]
      parameters:
      - name: user_id
        in: path
        required: true
        description: User identifier
        schema:
          type: string
      responses:
        "204":
          description: User deleted successfully
        "400":
           description: Invalid request
           content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                emptyUserId:
                  value:
                    error: id is required
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                userNotFound:
                  value:
                    error: user not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                internalError:
                  value:
                    error: internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid admin token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    Envelope:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        data:
          nullable: true
    AdminRulePayload:
      type: object
      required:
        - name
        - astro_condition
      properties:
        name:
          type: string
        astro_condition:
          type: object
          additionalProperties: true
        product_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
          default: 100
        is_active:
          type: boolean
          default: true
    AdminRule:
      type: object
      required:
        - id
        - name
        - astro_condition
        - product_tags
        - priority
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        astro_condition:
          type: object
          additionalProperties: true
        product_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminRuleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminRule"
    AdminRulesListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminRule"
                limit:
                  type: integer
                offset:
                  type: integer
                total_count:
                  type: integer
