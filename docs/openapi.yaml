openapi: 3.0.3
info:
  title: Astro Backend API
  version: 0.1.0
paths:
  /api/v1/:
    get:
      summary: Service health endpoint
      responses:
        "200":
          description: API and database status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/v1/admin/rules:
    get:
      summary: List astro rules
      security:
        - bearerAuth: []
      parameters:
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated astro rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRulesListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerErr"

    post:
      summary: Create an astro rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRulePayload"
      responses:
        "201":
          description: Astro rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerErr"

  /api/v1/admin/rules/{id}:
    get:
      summary: Single rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated astro rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRulesSingleEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerErr"

    put:
      summary: Update an astro rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRulePayload"
      responses:
        "200":
          description: Astro rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerErr"

    delete:
      summary: Soft delete an astro rule by deactivating it
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Astro rule deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerErr"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid admin token
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
    InternalServerErr:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
  schemas:
    Envelope:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        data:
          nullable: true
    AdminRulePayload:
      type: object
      required:
        - name
        - astro_condition
      properties:
        name:
          type: string
        astro_condition:
          type: array
          items:
            type: object
            properties:
              planet:
                type: string
              sign:
                type: string
        product_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
          default: 99
        is_active:
          type: boolean
          default: true
    AdminRule:
      type: object
      required:
        - id
        - name
        - astro_condition
        - product_tags
        - priority
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        astro_condition:
          type: object
          properties:
            planet:
              type: string
            sign:
              type: string
        product_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminRuleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminRule"
    AdminRulesListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminRule"
                metadata:
                  type: object
                  properties:
                    current_page:
                      type: integer
                    page_size:
                      type: integer
                    first_page:
                      type: integer
                    last_page:
                      type: integer
                    total_records:
                      type: integer
    AdminRulesSingleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                rule:
                  $ref: "#/components/schemas/AdminRule"
