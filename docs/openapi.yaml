openapi: 3.0.3
info:
  title: AI-Астростилист Backend API
  description: Backend API для Telegram-бота. Профиль пользователя, генерация рекомендаций, каталог товаров и правила маппинга.
  version: 2.0.0

servers:
  - url: https://api.astrostylist.example.com
    description: Production
  - url: http://localhost:8080
    description: Local

security:
  - botAuth: []

paths:

  # ─── Health ────────────────────────────────────────────────────────────────

  /api/v1/:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        "200":
          description: Статус сервиса и БД
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  # ─── Client API ────────────────────────────────────────────────────────────

  /api/v1/astro/profile:
    post:
      summary: Сохранить профиль пользователя
      description: |
        Принимает дату рождения, шифрует AES-256-GCM и сохраняет в БД.
        Если consent_given=false — данные НЕ сохраняются (живут только в памяти на время сессии).
        Обработка асинхронная через NATS.
      tags: [Client API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
            example:
              user_id: "123e4567-e89b-12d3-a456-426614174000"
              birth_date: "1990-05-15"
              birth_place: "Moscow"
              consent_given: true
      responses:
        "202":
          description: Профиль принят в обработку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/astro/recommend:
    post:
      summary: Запросить рекомендации
      description: |
        Инициирует генерацию персональных рекомендаций.

        **async mode (default):** возвращает 202 + request_id. Результат доставляется POST-ом на webhook_url бота.

        **sync mode:** удерживает соединение до готовности. Timeout: 5 секунд.
      tags: [Client API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendRequest"
            example:
              user_id: "123e4567-e89b-12d3-a456-426614174000"
              scenario: "personal_style"
              context:
                triggers: ["Венера в Тельце", "Полнолуние"]
                gender: "female"
                occasion: "work"
              mode: "async"
      responses:
        "200":
          description: Результат готов (sync mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendSyncEnvelope"
        "202":
          description: Принято в обработку (async mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "504":
          description: Timeout AI-сервиса (sync mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/v1/feedback:
    post:
      summary: Оставить обратную связь
      description: Сохраняет оценку рекомендации для улучшения промптов.
      tags: [Client API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: Feedback сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: request_id не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  # ─── Admin API ─────────────────────────────────────────────────────────────


  /api/v1/admin/login:
    post:
      summary: Авторизация SuperAdmin
      description: Возвращает JWT access token при валидных учетных данных SuperAdmin.
      tags: [Admin — Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: admin@example.com
              password: secure-password
      responses:
        "200":
          description: JWT успешно выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: JWT token
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 86400
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/rules:
    get:
      summary: Список правил маппинга
      tags: [Admin — Rules]
      security:
        - adminAuth: []
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Список правил с пагинацией
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRulesListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerErr"

    post:
      summary: Создать правило маппинга
      tags: [Admin — Rules]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRulePayload"
            example:
              name: "Венера в Тельце"
              astro_condition:
                planet: "Venus"
                sign: "Taurus"
              product_tags: ["luxury", "comfort", "classic"]
              priority: 10
              is_active: true
      responses:
        "201":
          description: Правило создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerErr"

  /api/v1/admin/rules/{id}:
    get:
      summary: Single rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated astro rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRulesSingleEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerErr"
    put:
      summary: Обновить правило
      tags: [Admin — Rules]
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRulePayload"
      responses:
        "200":
          description: Правило обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerErr"

    delete:
      summary: Деактивировать правило (soft delete)
      tags: [Admin — Rules]
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Правило деактивировано
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/AdminRuleEnvelope"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerErr"

  /api/v1/admin/products:
    get:
      summary: List products
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductsListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/products/{sku}:
    get:
      summary: Get product by SKU
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Partially update product tags and price
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductPatchPayload"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/catalog/import:
    post:
      summary: Импорт каталога из CSV
      description: |
        Загружает и обновляет каталог товаров через CSV-файл.

        Ожидаемая структура CSV:
        ```
        product_id,title,price,url,images,tags
        PROD-123,"Красная куртка",15990.00,"https://...","https://cdn.../img1.jpg","red,leather,sport"
        ```
      tags: [Admin — Catalog]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                update_strategy:
                  type: string
                  enum: [replace, merge]
                  default: merge
      responses:
        "200":
          description: Результат импорта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/catalog/sync:
    post:
      summary: Запустить синхронизацию с RetailCRM вручную
      tags: [Admin — Catalog]
      security:
        - adminAuth: []
      responses:
        "202":
          description: Синхронизация запущена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/logs:
    get:
      summary: Лог генераций (requests_log)
      tags: [Admin — Monitoring]
      security:
        - adminAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Лог запросов с пагинацией
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogsListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/requests/{id}:
    get:
      summary: Статус конкретного запроса (polling)
      description: Используется ботом для polling результата в sync-подобном сценарии.
      tags: [Admin — Monitoring]
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestLogEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


# ─── Components ──────────────────────────────────────────────────────────────

components:

  securitySchemes:
    botAuth:
      type: http
      scheme: bearer
      description: Bearer-токен для Telegram-бота
    adminAuth:
      type: http
      scheme: bearer
      description: JWT access token, полученный через POST /api/v1/admin/login

  responses:
    BadRequest:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Unauthorized:
      description: Отсутствует или невалидный токен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalServerErr:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
    ValidationError:
      description: Ошибка бизнес-валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"

  schemas:

    Envelope:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        data:
          nullable: true

    AcceptedEnvelope:
      type: object
      properties:
        request_id:
          type: string
          format: uuid

    # ─── Client ───────────────────────────────────────────────────────────────

    ProfileRequest:
      type: object
      required: [user_id, birth_date, consent_given]
      properties:
        user_id:
          type: string
          format: uuid
        birth_date:
          type: string
          format: date
          example: "1990-05-15"
        birth_time:
          type: string
          example: "14:30"
        birth_place:
          type: string
          example: "Moscow"
        consent_given:
          type: boolean

    RecommendRequest:
      type: object
      required: [user_id, scenario]
      properties:
        user_id:
          type: string
          format: uuid
        scenario:
          type: string
          enum: [personal_style, perfect_gift]
        context:
          type: object
          additionalProperties: true
          description: |
            Дополнительный контекст. Поддерживаемые ключи:
            - triggers (array of string) — астро-триггеры для Rule-Engine
            - gender (string)
            - occasion (string)
            - budget_range (string)
        mode:
          type: string
          enum: [async, sync]
          default: async

    RecommendSyncEnvelope:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
        result:
          type: string
          description: Сгенерированный AI-текст
        tags:
          type: array
          items:
            type: string

    FeedbackRequest:
      type: object
      required: [request_id, rating]
      properties:
        request_id:
          type: string
          format: uuid
        rating:
          type: string
          enum: [positive, negative, neutral]
        comment:
          type: string
          maxLength: 1000

    # ─── Admin Rules ──────────────────────────────────────────────────────────

    AdminRulePayload:
      type: object
      required: [name, astro_condition]
      properties:
        name:
          type: string
          maxLength: 255
        astro_condition:
          type: object
          additionalProperties: true
          description: Пример — {"planet":"Venus","sign":"Taurus"}
        product_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
          default: 99
        is_active:
          type: boolean
          default: true

    AdminRule:
      type: object
      required: [id, name, astro_condition, product_tags, priority, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        astro_condition:
          type: object
          additionalProperties: true
        product_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminRuleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminRule"

    AdminRulesListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminRule"
                metadata:
                  type: object
                  properties:
                    current_page:
                      type: integer
                    page_size:
                      type: integer
                    first_page:
                      type: integer
                    last_page:
                      type: integer
                    total_records:
                      type: integer
    AdminRulesSingleEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                rule:
                  $ref: "#/components/schemas/AdminRule"

    AdminProduct:
      type: object
      required:
        - sku
        - name
        - price
        - tags
        - category
        - created_at
        - updated_at
      properties:
        sku:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        tags:
          type: array
          items:
            type: string
        category:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminProductPatchPayload:
      type: object
      minProperties: 1
      properties:
        price:
          type: number
          format: double
          minimum: 0
        tags:
          type: array
          items:
            type: string
    PaginationMetadata:
      type: object
      required:
        - current_page
        - page_size
        - first_page
        - last_page
        - total_records
      properties:
        current_page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        first_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        total_records:
          type: integer
          minimum: 0
    AdminProductEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminProduct"
              
    AdminProductsListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminProduct"
                metadata:
                  $ref: "#/components/schemas/PaginationMetadata"

    # ─── Admin Catalog ────────────────────────────────────────────────────────

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ext_product_id:
          type: string
        title:
          type: string
        price:
          type: number
          format: double
        url:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogImportResult:
      type: object
      properties:
        imported:
          type: integer
        updated:
          type: integer
        errors:
          type: integer
        error_details:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              reason:
                type: string

    # ─── Admin Logs ───────────────────────────────────────────────────────────

    RequestLog:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        user_id:
          type: string
        scenario:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        attempt_count:
          type: integer
        error_reason:
          type: string
          nullable: true
        result_payload:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminLogEntry:
      type: object
      required:
        - request_id
        - user_id
        - status
        - error_message
        - created_at
        - completed_at
      properties:
        request_id:
          type: string
          format: uuid
        user_id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        error_message:
          type: string
          maxLength: 500
