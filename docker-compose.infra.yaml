# docker-compose.infra.yaml — только инфраструктура для локальной разработки.
# Поднимает ТОЛЬКО инфраструктуру (postgres, nats, memcached, jaeger)
# с проброшенными портами на localhost. Приложение запускается на хосте:
#   make infra-up
#   make run  # приложение читает .env (см. .env.local.template)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-astrobackend}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    command: ["-js", "-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats-data-local:/data
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8222/healthz?js-enabled-only=true >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6.39-alpine
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=2
    ports:
      - "11211:11211"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "14268:14268"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

volumes:
  pgdata-local:
  nats-data-local:
  prometheus_data: